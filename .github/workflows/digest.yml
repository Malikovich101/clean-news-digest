name: Run Clean Digest

on:
  schedule:
    # Утро: 03:14 UTC (08:14 Пермь)
    - cron: '14 3 * * *'
    # День: 09:22 UTC (14:22 Пермь)
    - cron: '22 9 * * *'
    # Вечер: 16:08 UTC (21:08 Пермь)
    - cron: '8 16 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute News Digest
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python digest.py

      - name: Notify on Pipeline Failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=🚨 <b>Критический сбой GitHub Actions</b>%0AДайджест не сформирован на этапе сборки/зависимостей." \
            -d "parse_mode=HTML"

      - name: Commit and push updated state
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state and 3d memory [skip ci]" && git push)
          
